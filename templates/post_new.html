{% extends "base.html" %}

{% block content %}
<style>
  .form-container {
    max-width: 650px;
    margin: 30px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    font-family: system-ui, -apple-system, sans-serif;
  }
  .form-title {
    font-size: 24px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f3f4f6;
  }
  .form-container p {
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
  }
  /* Ô nhập Title, Tác giả (dropdown) và Nội dung */
  .form-container input[type="text"],
  .form-container select,
  .form-container textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background-color: #ffffff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-container textarea {
    min-height: 140px;
    resize: vertical;
  }
  .form-container input[type="text"]:focus,
  .form-container select:focus,
  .form-container textarea:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  /* Ô tải tệp */
  .form-container input[type="file"] {
    font-size: 13px;
    color: #6b7280;
    margin-top: 4px;
  }
  /* Khung nút hành động */
  .form-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #f3f4f6;
  }
  .btn-submit {
    background-color: #2563eb;
    color: #ffffff;
    border: none;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .btn-submit:hover {
    background-color: #1d4ed8;
  }
  .btn-back {
    color: #4b5563;
    background-color: #f3f4f6;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    transition: background-color 0.15s ease;
  }
  .btn-back:hover {
    background-color: #e5e7eb;
    text-decoration: none;
  }
</style>

<div class="form-container">
  <h1 class="form-title">Tạo bài viết mới</h1>

  <form action="" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="form-actions">
      <input type="submit" value="Đăng bài" class="btn-submit">
      <a href="/" class="btn-back">Hủy bỏ</a>
    </div>
  </form>
</div>
{% endblock content %}
