{% extends "base.html" %}

{% block content %}
<style>
  .delete-container {
    max-width: 480px;
    margin: 40px auto;
    padding: 32px 24px;
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #fee2e2;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    text-align: center;
  }
  .delete-icon {
    width: 54px;
    height: 54px;
    background-color: #fee2e2;
    color: #ef4444;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 16px;
  }
  .delete-title {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 8px;
  }
  .delete-desc {
    font-size: 15px;
    color: #6b7280;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .delete-target-name {
    font-weight: 600;
    color: #b91c1c;
  }
  .delete-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .btn-confirm-delete {
    background-color: #ef4444;
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .btn-confirm-delete:hover {
    background-color: #dc2626;
  }
  .btn-cancel {
    background-color: #f3f4f6;
    color: #374151;
    text-decoration: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    transition: background-color 0.15s ease;
    display: inline-flex;
    align-items: center;
  }
  .btn-cancel:hover {
    background-color: #e5e7eb;
  }
</style>

<div class="delete-container">
  <div class="delete-icon">!</div>
  <h2 class="delete-title">Xóa bài viết</h2>
  <p class="delete-desc">
    Bạn có chắc chắn muốn xóa bài viết <br>
    <span class="delete-target-name">"{{ post.title }}"</span> không? Hành động này không thể hoàn tác.
  </p>

  <form action="" method="post">
    {% csrf_token %}
    <div class="delete-actions">
      <a href="{% url 'post_detail' post.pk %}" class="btn-cancel">Hủy bỏ</a>
      <input type="submit" value="Xóa vĩnh viễn" class="btn-confirm-delete">
    </div>
  </form>
</div>
{% endblock content %}
