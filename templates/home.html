{% extends "base.html" %}

{% block content %}
<style>
  .home-container {
    max-width: 800px;
    margin: 30px auto;
    padding: 0 16px;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .post-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .post-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
  }
  .post-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
  }
  .post-info {
    flex: 1;
  }
  .post-card-title {
    margin: 0 0 8px 0;
    font-size: 20px;
    font-weight: 700;
  }
  .post-card-title a {
    color: #1d4ed8;
    text-decoration: none;
  }
  .post-card-title a:hover {
    color: #1e40af;
    text-decoration: underline;
  }
  .post-card-body {
    margin: 0;
    color: #4b5563;
    font-size: 15px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .post-card-thumb {
    width: 100px;
    height: 75px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
  }
</style>

<div class="home-container">
  <div class="post-list">
    {% for post in post_list %}
      <div class="post-card">
        <div class="post-info">
          <h2 class="post-card-title">
            <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
          </h2>
          <p class="post-card-body">{{ post.body }}</p>
        </div>

        {% if post.image %}
          <img src="{{ post.image.url }}" alt="{{ post.title }}" class="post-card-thumb">
        {% endif %}
      </div>
    {% endfor %}
  </div>
</div>
{% endblock content %}
