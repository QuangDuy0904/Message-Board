{% extends "base.html" %}

{% block content %}
<style>
  .auth-card {
    max-width: 420px;
    margin: 40px auto;
    padding: 32px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    font-family: system-ui, -apple-system, sans-serif;
  }
  .auth-card h2 {
    margin-bottom: 20px;
    font-size: 24px;
    font-weight: 700;
    color: #111827;
  }
  .auth-card p {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
  }
  .auth-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    transition: border-color 0.15s ease;
  }
  .auth-card input:focus {
    outline: none;
    border-color: #2563eb;
  }
  /* Ẩn các dòng hướng dẫn dài, nhưng GIỮ LẠI BÁO LỖI (errorlist) */
  .auth-card .helptext {
    display: none;
  }
  .errorlist {
    color: #dc2626;
    font-size: 13px;
    font-weight: 500;
    margin: 4px 0 0 0;
    padding-left: 18px;
  }
  .btn-submit {
    width: 100%;
    padding: 11px;
    background: #10b981;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.15s ease;
  }
  .btn-submit:hover {
    background: #059669;
  }
  .auth-footer {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    color: #6b7280;
  }
  .auth-footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }
</style>

<div class="auth-card">
  <h2>Đăng ký</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-submit">Tạo tài khoản</button>
  </form>

  <div class="auth-footer">
    Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a>
  </div>
</div>
{% endblock content %}
